name: alzeh
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  flutter_screenutil: ^5.9.3
  image_picker: ^1.2.0
  curved_navigation_bar: ^1.0.6

  # Firebase dependencies
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
