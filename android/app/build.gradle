plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.alzeh"
    compileSdk = 35  // Updated to 35 for latest plugins
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId = "com.example.alzeh"
        minSdk = 24  // Changed from flutter.minSdkVersion - Required for Firebase
        targetSdk = 35  // Updated to 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true  // Added for Firebase
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Firebase dependencies
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'

    // MultiDex support for Firebase
    implementation 'androidx.multidex:multidex:2.0.1'
}

// IMPORTANT: This must be at the very bottom of the file
apply plugin: 'com.google.gms.google-services'